name: Active Age CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - '3-Semestre/**'
      - '4-Semestre/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - '3-Semestre/**'
      - '4-Semestre/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  # =========================================================================
  # JOB 1: Backend CI (Java 21 LTS + Spring Boot 3 + Jacoco + Artefatos)
  # =========================================================================
  backend-ci:
    name: Backend Core (Java 21 / Spring Boot)
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Código-Fonte
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 21 LTS (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Conceder Permissão de Execução ao Maven Wrapper
        run: chmod +x 3-Semestre/backend-core/mvnw

      - name: Compilar, Testar e Gerar Cobertura (Jacoco)
        run: |
          cd 3-Semestre/backend-core
          ./mvnw test -Dspring.data.mongodb.uri=mongodb://localhost:27017/active_age_test

      - name: Upload Relatórios de Testes JUnit (Surefire)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-surefire-reports
          path: 3-Semestre/backend-core/target/surefire-reports/
          retention-days: 14

      - name: Upload Relatório de Cobertura Jacoco
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-jacoco-coverage
          path: 3-Semestre/backend-core/target/site/jacoco/
          retention-days: 14

  # =========================================================================
  # JOB 2: Frontend CI (Node 22 + React 19 + TypeScript + Linter + Artefatos)
  # =========================================================================
  frontend-ci:
    name: Frontend SPA (React 19 / TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código-Fonte
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 3-Semestre/frontend-react/package-lock.json

      - name: Instalar Dependências
        run: |
          cd 3-Semestre/frontend-react
          npm ci || npm install

      - name: Auditoria de Segurança de Dependências (npm audit)
        run: |
          cd 3-Semestre/frontend-react
          npm audit --audit-level=critical || true

      - name: Análise Estática e Linter de Código (oxlint)
        run: |
          cd 3-Semestre/frontend-react
          npm run lint

      - name: Executar Validação de Tipagem e Build de Produção (Vite)
        run: |
          cd 3-Semestre/frontend-react
          npm run build

      - name: Upload Artefato do Build Frontend (dist)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-artifact
          path: 3-Semestre/frontend-react/dist/
          retention-days: 14

  # =========================================================================
  # JOB 3: DevSecOps & Container Docker (Trivy Scan + Docker Multi-Stage)
  # =========================================================================
  security-and-docker-ci:
    name: DevSecOps & Container Docker
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código-Fonte
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Trivy CLI (Scanner Oficial DevSecOps)
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          trivy --version

      - name: Scanner de Segurança em Dependências e Código (Trivy FS Scan)
        continue-on-error: true
        run: |
          trivy fs --offline-scan --scanners vuln --format table --severity CRITICAL,HIGH --exit-code 0 . || \
          trivy fs --scanners vuln --format table --severity CRITICAL,HIGH --exit-code 0 . || true

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir Imagem Docker Multi-Stage de Produção (Backend Core)
        run: |
          docker build -t active-age-backend-core:ci 3-Semestre/backend-core

      - name: Scanner de Vulnerabilidades na Imagem Docker (Trivy Image Scan)
        continue-on-error: true
        run: |
          trivy image --format table --severity CRITICAL --exit-code 0 active-age-backend-core:ci || true

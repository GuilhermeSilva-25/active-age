<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel do Paciente - Active Age</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-white shadow-sm py-3">
      <div class="container">
        <a class="navbar-brand" href="index.html">
          <img
            src="./assets/logo-active-age.png"
            alt="Active Age Logo"
            height="60"
          />
        </a>
        <div>
          <span
            class="me-3 fw-bold"
            id="nomePaciente"
            style="color: var(--aa-brown)"
          ></span>
          <button
            class="btn btn-outline-danger"
            onclick="
              sessionStorage.clear();
              window.location.href = 'index.html';
            "
          >
            Sair
          </button>
        </div>
      </div>
    </nav>

    <div class="container mt-5">
      <h3 style="color: var(--aa-brown)" class="mb-3">Marcar Nova Consulta</h3>
      <form id="formAgendamento" class="bg-white p-4 shadow-sm rounded mb-5">
        <div class="row">
          <div class="col-md-5">
            <label class="fw-bold mb-1">Escolha o Especialista:</label>
            <select id="medicoId" class="form-select" required>
              <option value="1">Dra. Ada Lovelace (Neurologia)</option>
              <option value="2">Dr. Alan Turing (Cardiologia)</option>
              <option value="3">Dr. Linus Torvalds (Geriatria)</option>
            </select>
          </div>
          <div class="col-md-5">
            <label class="fw-bold mb-1">Data e Hora:</label>
            <input
              type="datetime-local"
              id="dataHora"
              class="form-control"
              required
            />
          </div>
          <div class="col-md-2 d-flex align-items-end">
            <button type="submit" class="btn btn-primary w-100">Agendar</button>
          </div>
        </div>
      </form>

      <h3 style="color: var(--aa-brown)" class="mb-3">Minhas Consultas</h3>
      <div class="table-responsive bg-white shadow-sm rounded p-3">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th>Especialista</th>
              <th>Data/Hora</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaAgendamentos"></tbody>
        </table>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="agendamento.js"></script>
  </body>
</html>

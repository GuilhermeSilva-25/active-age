<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro - Active Age</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white shadow-sm py-3">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="index.html">
          <img
            src="../assets/logo-active-age.png"
            alt="Active Age Logo"
            height="110"
            class="me-2"
          />
        </a>
        <a href="login.html" class="btn btn-outline-secondary"
          >Já tenho conta</a
        >
      </div>
    </nav>

    <main class="container my-5">
      <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">
          <header class="text-center mb-4">
            <h1 class="fw-bold mb-3" style="color: var(--aa-brown)">
              Crie sua Conta
            </h1>
            <p class="fs-5 text-muted">
              Bem-vindo ao Active Age! Vamos começar.
            </p>
          </header>

          <div class="card shadow-sm border-0" style="border-radius: 15px">
            <div class="card-body p-4 p-md-5">
              <form id="formCadastro">
                <div class="mb-4">
                  <label
                    class="form-label mb-3 fw-bold fs-5"
                    style="color: var(--aa-brown)"
                    >Qual tipo de perfil você deseja criar?</label
                  >
                  <div class="row g-3">
                    <div class="col-sm-6">
                      <input
                        type="radio"
                        class="btn-check"
                        name="tipoUsuario"
                        id="radioPaciente"
                        value="PACIENTE"
                        checked
                      />
                      <label
                        class="btn btn-outline-primary w-100 p-4 h-100 d-flex flex-column align-items-center justify-content-center"
                        for="radioPaciente"
                      >
                        <i class="bi bi-person-heart fs-1 mb-2"></i>
                        <span class="fs-5 fw-bold">Paciente / Cuidador</span>
                      </label>
                    </div>
                    <div class="col-sm-6">
                      <input
                        type="radio"
                        class="btn-check"
                        name="tipoUsuario"
                        id="radioMedico"
                        value="MEDICO"
                      />
                      <label
                        class="btn btn-outline-primary w-100 p-4 h-100 d-flex flex-column align-items-center justify-content-center"
                        for="radioMedico"
                      >
                        <i class="bi bi-bandaid fs-1 mb-2"></i>
                        <span class="fs-5 fw-bold">Médico Geriatra</span>
                      </label>
                    </div>
                  </div>
                </div>

                <div class="form-floating mb-3">
                  <input
                    type="text"
                    class="form-control"
                    id="nome"
                    placeholder="Nome"
                    required
                  />
                  <label for="nome">Nome Completo</label>
                </div>

                <div class="row g-3 mb-3">
                  <div class="col-md-6">
                    <div class="form-floating">
                      <input
                        type="email"
                        class="form-control"
                        id="email"
                        placeholder="E-mail"
                        required
                      />
                      <label>E-mail</label>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="form-floating">
                      <input
                        type="tel"
                        class="form-control"
                        id="telefone"
                        placeholder="Telefone"
                      />
                      <label>Telefone</label>
                    </div>
                  </div>
                </div>

                <div id="areaPaciente" class="form-floating mb-3">
                  <input
                    type="text"
                    class="form-control"
                    id="cpf"
                    placeholder="CPF"
                  />
                  <label>CPF</label>
                </div>

                <div
                  id="areaMedico"
                  class="card bg-light border-0 mb-4 p-4 d-none"
                  style="border-radius: 15px"
                >
                  <div class="form-floating mb-4">
                    <input
                      type="text"
                      class="form-control bg-white"
                      id="crm"
                      placeholder="CRM"
                    />
                    <label>CRM (Ex: 123456/SP)</label>
                  </div>
                  <label class="form-label fw-bold text-muted mb-2"
                    >Especialidades Médicas</label
                  >
                  <div class="d-flex flex-wrap gap-2 mb-3">
                    <span class="badge bg-secondary fs-6 py-2 shadow-sm"
                      ><i class="bi bi-star-fill text-warning me-1"></i>
                      Geriatria (Padrão)</span
                    >
                  </div>
                </div>

                <div class="form-floating mb-3">
                  <input
                    type="password"
                    class="form-control"
                    id="senha"
                    placeholder="Senha"
                    required
                  />
                  <label>Crie uma Senha</label>
                </div>

                <div class="form-floating mb-4">
                  <input
                    type="password"
                    class="form-control"
                    id="confirmarSenha"
                    placeholder="Confirme"
                    required
                  />
                  <label>Confirme sua Senha</label>
                </div>

                <div class="d-grid">
                  <button
                    type="submit"
                    class="btn btn-primary btn-lg py-3 fs-5 shadow-sm"
                  >
                    Criar Minha Conta
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer class="text-white-50 py-5">
      <div class="container text-center">
        <h5 class="text-white mb-3">Active Age</h5>
        <p>Conectando cuidado e tecnologia para a saúde da terceira idade.</p>
        <p class="mb-0 mt-4 border-top border-secondary pt-3">
          &copy; 2026 Active Age. Todos os direitos reservados.
        </p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="app.js"></script>
  </body>
</html>

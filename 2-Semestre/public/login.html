<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Active Age</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white shadow-sm py-3">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="index.html">
          <img
            src="./assets/logo-active-age.png"
            alt="Active Age Logo"
            height="110"
            class="me-2"
          />
        </a>
        <a href="cadastro.html" class="btn btn-outline-secondary"
          >Cadastre-se</a
        >
      </div>
    </nav>

    <main class="container my-5">
      <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
          <header class="text-center mb-4">
            <h1 class="fw-bold mb-3" style="color: var(--aa-brown)">
              Acesse sua Conta
            </h1>
            <p class="fs-5 text-muted">
              Bem-vindo(a) de volta! Insira seus dados para continuar.
            </p>
          </header>

          <article class="card shadow-sm border-0" style="border-radius: 15px">
            <div class="card-body p-4 p-md-5">
              <form id="formLogin">
                <div class="form-floating mb-3">
                  <input
                    type="email"
                    class="form-control"
                    id="loginEmail"
                    placeholder="seu@email.com"
                    required
                  />
                  <label for="loginEmail">E-mail</label>
                </div>

                <div class="form-floating mb-4">
                  <input
                    type="password"
                    class="form-control"
                    id="loginSenha"
                    placeholder="Senha"
                    required
                  />
                  <label for="loginSenha">Senha</label>
                </div>

                <div class="d-grid gap-3">
                  <button
                    type="submit"
                    class="btn btn-primary btn-lg py-3 fs-5 shadow-sm"
                  >
                    Entrar
                  </button>
                </div>
              </form>
            </div>
          </article>
        </div>
      </div>
    </main>
    <footer class="text-white-50 py-5">
      <div class="container text-center">
        <h5 class="text-white mb-3">Active Age</h5>
        <p>Conectando cuidado e tecnologia para a saúde da terceira idade.</p>
        <p class="mb-0 mt-4 border-top border-secondary pt-3">
          &copy; 2026 Active Age. Todos os direitos reservados.
        </p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="app.js"></script>
  </body>
</html>

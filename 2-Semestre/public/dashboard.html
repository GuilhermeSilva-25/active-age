<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu Painel - Active Age</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white shadow-sm py-3">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="index.html">
          <img
            src="../assets/logo-active-age.png"
            alt="Active Age Logo"
            height="110"
            class="me-2"
          />
        </a>
        <div>
          <button id="btnLogout" class="btn btn-outline-danger">
            Sair da Conta
          </button>
        </div>
      </div>
    </nav>

    <main class="container my-5 text-center">
      <div class="p-5 mb-4 bg-light rounded-3 shadow-sm border">
        <div class="container-fluid py-5">
          <h1
            class="display-5 fw-bold"
            style="color: var(--aa-brown)"
            id="dashTitle"
          >
            Painel
          </h1>
          <p class="col-md-8 fs-4 mx-auto text-muted mt-3">
            Olá,
            <strong id="dashNome" style="color: var(--aa-orange)"
              >Usuário</strong
            >! Seja bem-vindo(a) ao Dashboard.
          </p>
          <hr class="my-4" />
          <p class="fs-5 text-secondary">
            Esta é a tela de simulação do dashboard.
          </p>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="app.js"></script>
  </body>
</html>

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Painel do Médico - Active Age</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-white shadow-sm py-3">
      <div class="container">
        <a class="navbar-brand" href="index.html">
          <img
            src="./assets/logo-active-age.png"
            alt="Active Age Logo"
            height="60"
          />
        </a>
        <div>
          <span
            class="me-3 fw-bold"
            id="nomeMedico"
            style="color: var(--aa-brown)"
          ></span>
          <button
            class="btn btn-outline-danger"
            onclick="
              sessionStorage.clear();
              window.location.href = 'index.html';
            "
          >
            Sair
          </button>
        </div>
      </div>
    </nav>

    <div class="container mt-5">
      
      <h3 style="color: var(--aa-brown)" class="mb-3">
        Minha Agenda de Pacientes
      </h3>
      <div class="table-responsive bg-white shadow-sm rounded p-3">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th>Paciente</th>
              <th>Data/Hora da Consulta</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaAgendamentosMedico">
          </tbody>
        </table>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="agendamento.js"></script>
  </body>
</html>

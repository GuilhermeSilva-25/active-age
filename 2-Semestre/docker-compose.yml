version: '3.8'

services:
  db-active-age:
    image: mysql:8.0
    container_name: mysql_active_age
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: active_age
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
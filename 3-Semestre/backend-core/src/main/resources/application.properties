spring.application.name=ActiveAgeCore

server.port=${PORT:8080}

spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/activeage_dev}

server.error.include-message=always

jwt.expiration=86400000
jwt.secret=${JWT_SECRET:um-segredo-muito-grande-e-complexo-para-o-nosso-jwt-active-age-2026}

# Configuracoes de Upload de Arquivos (Dossie Medico - RF002)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
activeage.upload.dir=uploads/dossiers
